<!doctype html>
<html>
  <link rel="stylesheet" href="output.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link
    rel="stylesheet"
    href="../static/purecss-circular-progress-bar-master/css-circular-prog-bar.css"
  />
  <script src="../static/chart.umd.js"></script>
  <div class="container">
    <div class="header"><h2 class="font-bold">Dashboard</h2></div>
    <body>
      <div class="menu menu_button_container">
        <button id="home_menu_btn" class="menu_button_">Menu</button>
        <button id="analytics_btn" class="menu_button_">Analytics</button>
        <button id="toggleThemeBtn" class="menu_button_">Toggle Theme</button>
      </div>
      <div class="display-area view active" id="home_view">
        <div class="progress-circle" id="score-circle">
          <span id="scoreText">Score: 100%</span>
          <div class="left-half-clipper" id="left-half-clipper">
            <div class="first50-bar" id="first50-bar"></div>
            <div class="value-bar" id="value-bar"></div>
          </div>
        </div>
        <div id="cookie_section">
          <div id="cookie_container">
            <h3>Detected Cookies</h3>
          </div>
          <div>
            <form id="whitelist_form">
              <h4 class="whitelist_header">Whitelisted sites</h4>
              <div id="whitelist_list"></div>
              <div class="flex_row">
                <h4 class="whitelist_header">Add Site:</h4>
                <input
                  id="domain_input"
                  name="domain_input"
                  type="text"
                  value="whitelistexample.com"
                />
              </div>
              <button type="submit" id="submit_btn">Submit</button>
            </form>
          </div>
        </div>
      </div>
      <div class="view container display-area" id="analytics_view">
        <canvas id="insecure_cookies_chart"></canvas>
      </div>
    </body>
  </div>
  <script src="dashboard.js"></script>
</html>
