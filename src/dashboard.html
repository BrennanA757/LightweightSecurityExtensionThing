<!doctype html>
<html>
  <link rel="stylesheet" href="output.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link
    rel="stylesheet"
    href="../static/purecss-circular-progress-bar-master/css-circular-prog-bar.css"
  />
  <div class="dark:bg-grey-800" style="display: flex; align-items: center">
    <header class="font-bold">Dashboard</header>
    <body style="background-color: black">
      <div id="first-section" class="box">
        <button id="toggleThemeBtn">Toggle Theme</button>
      </div>
      <div id="section-section" class="box">
        <div class="progress-circle" id="score-circle">
          <span id="scoreText">10%</span>
          <div class="left-half-clipper">
            <div class="first50-bar"></div>
            <div class="value-bar"></div>
          </div>
        </div>
      </div>
    </body>
  </div>
  <script src="dashboard.js"></script>
</html>
